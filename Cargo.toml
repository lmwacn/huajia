[package]
name = "huajia"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Lightweight Mi Home control via CLI or HTTP."
repository = "https://github.com/lmwacn/huajia"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
if-addrs = "0.15"
md-5 = "0.10"
base64 = "0.22"
dirs = "6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
rc4 = "0.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls", "cookies"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
